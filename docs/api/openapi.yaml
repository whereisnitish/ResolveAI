    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - token
    ToolExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tool_name:
          type: string
          readOnly: true
        arguments:
          readOnly: true
        result:
          readOnly: true
        status:
          type: string
          readOnly: true
        latency_ms:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - arguments
      - created_at
      - id
      - latency_ms
      - result
      - status
      - tool_name
    TriggerEnum:
      enum:
      - conversation_created
      - customer_message
      - conversation_resolved
      - conversation_unanswered
      type: string
      description: |-
        * `conversation_created` - New conversation
        * `customer_message` - Customer sends a message
        * `conversation_resolved` - Conversation resolved
        * `conversation_unanswered` - Customer waiting without a reply
    TypeEnum:
      enum:
      - created
      - status_changed
      - priority_changed
      - assigned
      - team_assigned
      - tags_changed
      - reopened
      - handoff
      - human_takeover
      - ai_resumed
      type: string
      description: |-
        * `created` - Created
        * `status_changed` - Status changed
        * `priority_changed` - Priority changed
        * `assigned` - Assigned
        * `team_assigned` - Team assigned
        * `tags_changed` - Tags changed
        * `reopened` - Reopened by customer
        * `handoff` - AI handed off
        * `human_takeover` - Human took over
        * `ai_resumed` - AI resumed
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - email_verified
      - id
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - full_name
      - id
    UserSummaryRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
      - full_name
      - id
    VisitorMessageRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required:
      - body
    WidgetConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ConversationStatusEnum'
          readOnly: true
        last_message_preview:
          type: string
          readOnly: true
        last_message_author_type:
          allOf:
          - $ref: '#/components/schemas/ActorTypeEnum'
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_message_at
      - last_message_author_type
      - last_message_preview
      - number
      - status
    WidgetPublicSettings:
      type: object
      properties:
        brand_color:
          type: string
          readOnly: true
        team_name:
          type: string
          readOnly: true
        welcome_message:
          type: string
          readOnly: true
        launcher_position:
          allOf:
          - $ref: '#/components/schemas/LauncherPositionEnum'
          readOnly: true
        collect_email:
          type: boolean
          readOnly: true
      required:
      - brand_color
      - collect_email
      - launcher_position
      - team_name
      - welcome_message
    WidgetSettings:
      type: object
      description: Dashboard-side (admin) representation of the widget configuration.
      properties:
        enabled:
          type: boolean
        allowed_origins:
          type: array
          items:
            type: string
            maxLength: 255
          maxItems: 50
        brand_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        team_name:
          type: string
          maxLength: 80
        welcome_message:
          type: string
          maxLength: 300
        launcher_position:
          $ref: '#/components/schemas/LauncherPositionEnum'
        collect_email:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/TriggerEnum'
        trigger_config: {}
        conditions: {}
        actions: {}
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        run_count:
          type: integer
          readOnly: true
        last_run_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_run_at
      - name
      - run_count
      - trigger
      - updated_at
    WorkflowExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        conversation:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        conversation_number:
          type: integer
          readOnly: true
        trigger:
          allOf:
          - $ref: '#/components/schemas/TriggerEnum'
          readOnly: true
        status:
          type: string
          readOnly: true
        results:
          readOnly: true
        error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - conversation
      - conversation_number
      - created_at
      - error
      - id
      - results
      - status
      - trigger
    WorkflowRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 300
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/TriggerEnum'
        trigger_config: {}
        conditions: {}
        actions: {}
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - name
      - trigger
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        public_id:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
          default: false
        role:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_default
      - name
      - organization
      - public_id
      - role
      - slug
      - timezone
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          allOf:
          - $ref: '#/components/schemas/TimezoneEnum'
          default: UTC
      required:
      - name
    WorkspaceMemberCreateRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role:
          allOf:
          - $ref: '#/components/schemas/WorkspaceRoleEnum'
          default: agent
      required:
      - user_id
    WorkspaceMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/WorkspaceRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - role
      - user
    WorkspaceRoleEnum:
      enum:
      - admin
      - supervisor
      - agent
      - viewer
      type: string
      description: |-
        * `admin` - Admin
        * `supervisor` - Supervisor
        * `agent` - Agent
        * `viewer` - Viewer
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: resolveai_session
    widgetSession:
      type: http
      scheme: bearer
      description: Short-lived widget session token from POST /api/v1/widget/session/.
