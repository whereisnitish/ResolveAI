components:
  schemas:
    AIAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        instructions:
          type: string
          maxLength: 20000
        provider:
          $ref: '#/components/schemas/AIProviderEnum'
        model:
          type: string
          maxLength: 100
        effort:
          $ref: '#/components/schemas/AIEffortEnum'
        max_output_tokens:
          type: integer
          maximum: 32000
          minimum: 256
        use_all_knowledge:
          type: boolean
        knowledge_source_ids:
          type: array
          items:
            type: string
            format: uuid
        retrieval_top_k:
          type: integer
          maximum: 20
          minimum: 1
        min_relevance:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
        answer_only_from_knowledge:
          type: boolean
        tone:
          type: string
          maxLength: 200
        greeting:
          type: string
          maxLength: 300
        handoff_confidence_threshold:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
        handoff_on_no_knowledge:
          type: boolean
        handoff_keywords:
          type: array
          items:
            type: string
            maxLength: 60
        max_ai_replies:
          type: integer
          maximum: 100
          minimum: 1
        handoff_team_id:
          type: string
          format: uuid
          nullable: true
        handoff_message:
          type: string
          maxLength: 300
        allow_after_human_takeover:
          type: boolean
        enabled:
          type: boolean
        is_deployed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_deployed
      - name
      - updated_at
    AIAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        instructions:
          type: string
          maxLength: 20000
        provider:
          $ref: '#/components/schemas/AIProviderEnum'
        model:
          type: string
          minLength: 1
          maxLength: 100
        effort:
          $ref: '#/components/schemas/AIEffortEnum'
        max_output_tokens:
          type: integer
          maximum: 32000
          minimum: 256
        use_all_knowledge:
          type: boolean
        knowledge_source_ids:
          type: array
          items:
            type: string
            format: uuid
        retrieval_top_k:
          type: integer
          maximum: 20
          minimum: 1
        min_relevance:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
        answer_only_from_knowledge:
          type: boolean
        tone:
          type: string
          maxLength: 200
        greeting:
          type: string
          maxLength: 300
        handoff_confidence_threshold:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
        handoff_on_no_knowledge:
