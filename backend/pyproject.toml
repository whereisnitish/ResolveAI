[project]
name = "resolveai-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reuse-db"
filterwarnings = ["error::RuntimeWarning"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012", "S101", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"config/settings/*.py" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "tests"]

[tool.coverage.run]
source = ["apps", "common"]
omit = ["*/migrations/*", "*/admin.py"]
