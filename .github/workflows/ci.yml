name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: resolveai
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resolveai" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ci-only-password
      REDIS_URL: redis://localhost:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://localhost:6379/3
      CELERY_BROKER_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are committed
        run: DJANGO_ENV=test python manage.py makemigrations --check --dry-run
      - name: Tests (incl. the 7 critical security tests)
        run: pytest -q --cov=apps --cov=common --cov-report=term --cov-fail-under=85
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements/base.txt --strict
      - name: OpenAPI schema is current
        run: |
          DJANGO_ENV=test python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff -q /tmp/openapi.yaml ../docs/api/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: node build.mjs
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, widget]
    steps:
      - uses: actions/checkout@v5
      - name: Build production images
        run: |
          docker build --target prod -t resolveai-backend:ci backend
          docker build --target prod -t resolveai-frontend:ci frontend
          docker build -t resolveai-widget:ci widget
      - name: Backend image refuses unsafe config
        run: |
          # DEBUG/placeholder secrets must fail `check --deploy` (resolveai.E00x).
          ! docker run --rm -e DJANGO_SECRET_KEY=change-me -e FIELD_ENCRYPTION_KEY=x \
              resolveai-backend:ci python manage.py check --deploy --fail-level ERROR

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, widget]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: resolveai
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resolveai" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DJANGO_ENV: dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ci-only-password
      REDIS_URL: redis://localhost:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://localhost:6379/3
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "true"
      FRONTEND_URL: http://localhost:3101
      CSRF_TRUSTED_ORIGINS: http://localhost:3101
      CORS_ALLOWED_ORIGINS: http://localhost:3101
      E2E_BASE_URL: http://localhost:3101
      E2E_API_URL: http://localhost:8001
      E2E_WIDGET_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: pip install -r backend/requirements/base.txt
      - run: python manage.py migrate --noinput
        working-directory: backend
      - name: Start backend (eager Celery, mock AI)
        working-directory: backend
        run: nohup uvicorn config.asgi:application --port 8001 > /tmp/backend.log 2>&1 &
      - name: Build & start dashboard
        working-directory: frontend
        env:
          BACKEND_INTERNAL_URL: http://localhost:8001
          NEXT_PUBLIC_WS_URL: ws://localhost:8001
        run: npm ci && npm run build && (nohup npx next start -p 3101 > /tmp/frontend.log 2>&1 &)
      - name: Start widget demo
        working-directory: widget
        run: npm ci && (nohup node build.mjs --serve > /tmp/widget.log 2>&1 &)
      - working-directory: e2e
        run: npm ci && npm run typecheck && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: tail -n 200 /tmp/backend.log /tmp/frontend.log /tmp/widget.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
