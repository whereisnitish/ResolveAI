# Production-like stack on a single host (staging, small deployments, or to validate
# the images locally). On AWS the same images run on ECS/Fargate with RDS, ElastiCache
# and S3 instead of the db/redis containers — see docs/operations/DEPLOYMENT.md.
#
#   cp .env.prod.example .env.prod   # fill in real values (never commit it)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: resolveai-prod

x-backend: &backend
  image: resolveai-backend:${APP_RELEASE:-latest}
  build:
    context: ./backend
    target: prod
    args:
      APP_RELEASE: ${APP_RELEASE:-}
  env_file: .env.prod
  environment:
    DJANGO_ENV: prod
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    CHANNEL_LAYER_REDIS_URL: redis://redis:6379/3
    TRUSTED_PROXY_COUNT: "1"
    FORWARDED_ALLOW_IPS: "*"   # only nginx can reach the backend on this private network
  volumes:
    - media:/app/media         # unused when AWS_STORAGE_BUCKET_NAME is set
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveai}
      POSTGRES_USER: ${POSTGRES_USER:-resolveai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: refuses to start the app on unsafe config, then migrates.
  migrate:
    <<: *backend
    command: sh -c "python manage.py check --deploy --fail-level ERROR && DB_STATEMENT_TIMEOUT_MS=0 python manage.py migrate --noinput"
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    image: resolveai-frontend:${APP_RELEASE:-latest}
    build:
      context: ./frontend
      target: prod
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
        NEXT_PUBLIC_WIDGET_SCRIPT_URL: ${PUBLIC_WIDGET_SCRIPT_URL:-}
        NEXT_PUBLIC_WIDGET_API_URL: ${PUBLIC_WIDGET_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend

  widget:
    image: resolveai-widget:${APP_RELEASE:-latest}
    build:
      context: ./widget
    ports:
      - "${WIDGET_PORT:-8080}:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  media:
