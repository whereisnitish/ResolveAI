# ResolveAI ingress (single host). Routes:
#   /api/*, /ws/*, /static/*  -> Django (ASGI: HTTP + WebSockets)
#   everything else           -> Next.js
# The Django admin is deliberately NOT routed publicly: reach it over a VPN/bastion or
# with `docker compose exec backend python manage.py ...`.
# TLS: terminate here (certs mounted at /etc/nginx/certs) or at a cloud load balancer
# in front (then listen on 80 only and trust X-Forwarded-Proto from it).

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"upstream_rt":"$upstream_response_time","request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    client_max_body_size 25m;   # knowledge uploads; Django enforces per-type limits

    # Coarse per-IP edge limits; fine-grained limits live in Django (per user / per account).
    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Propagate an incoming request id or mint one; Django echoes X-Request-ID.
    map $http_x_request_id $req_id { default $http_x_request_id; '' $request_id; }

    upstream django { server backend:8000; keepalive 32; }
    upstream nextjs { server frontend:3000; keepalive 32; }

    server {
        listen 80 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;
        proxy_set_header Connection        "";

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        location ~ ^/api/v1/auth/(login|register|password) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://django;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_read_timeout 120s;   # AI playground / knowledge ingestion requests
            proxy_pass http://django;
        }

        location /ws/ {
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://django;
        }

        location /static/ {
            proxy_pass http://django;   # WhiteNoise: hashed names, far-future cache headers
        }

        location / {
            proxy_pass http://nextjs;
        }
    }
}
